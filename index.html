<style>
:root{
  --bg:#f7f7f5; --surface:#ffffff; --surface-2:#f1f1ee; --line:#e3e3de;
  --text:#1d1f1e; --muted:#6f7570; --accent:#1f6f4f; --accent-soft:#e8f2ec;
  --gold:#a8862c; --pad:16px; --r:12px;
  --shadow:0 1px 2px rgba(20,25,22,.05), 0 8px 24px -18px rgba(20,25,22,.35);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#14171a;--surface:#1b1f23;--surface-2:#232a2f;--line:#2c343a;
    --text:#e9edf0;--muted:#98a3ab;--accent:#5fc79b;--accent-soft:#1d2f28;--gold:#d9b45f;
    --shadow:0 1px 2px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.6}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--pad)}

/* header */
header{background:var(--surface);border-bottom:1px solid var(--line)}
.head-in{padding:18px 0 14px}
.kicker{font:500 11px/1 "Roboto Mono",monospace;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
h1{font-size:clamp(19px,4.6vw,26px);line-height:1.35;margin:8px 0 4px;font-weight:700}
.sub{color:var(--muted);font-size:12.5px;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px;text-align:center}
.stat b{display:block;font-family:"Roboto Mono",monospace;font-size:16px}
.stat span{font-size:10.5px;color:var(--muted)}

/* tabs + controls */
.sticky{position:sticky;top:0;z-index:30;background:color-mix(in oklab,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;padding:8px 0}
.tab{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 6px;border-radius:9px;font-size:13.5px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--text);font-weight:700;box-shadow:var(--shadow)}
.searchbar{display:flex;gap:8px;padding-bottom:8px}
.search{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:11px 13px;font-size:16px;outline:none}
.search:focus{border-color:var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;cursor:pointer;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
@media (prefers-color-scheme: dark){.chip[aria-pressed="true"]{color:#0f1512}}

main{padding-top:14px;padding-bottom:64px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:10px}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12px;padding:4px}

/* cards */
.grid{display:grid;gap:10px}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.grid.rank{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;align-self:start}
summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;gap:10px;align-items:flex-start}
summary::-webkit-details-marker{display:none}
.ttl{flex:1;min-width:0}
.ttl h2{margin:0;font-size:14.5px;font-weight:700;line-height:1.45}
.rmeta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:5px;align-items:center}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:10.5px;background:var(--surface-2)}
.tag.g{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.caret{color:var(--muted);font-size:11px;margin-top:3px;transition:transform .18s}
details[open] .caret{transform:rotate(90deg)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--surface-2);color:var(--muted);font-weight:500;font-size:10.5px;text-align:left;padding:6px 10px}
td{padding:9px 10px;border-top:1px solid var(--line)}
tr.hit td{background:var(--accent-soft)}
tr.fav td{box-shadow:inset 3px 0 0 var(--gold)}
.rk{font-family:"Roboto Mono",monospace;width:30px;text-align:center;color:var(--muted)}
.rk.p1{color:var(--gold);font-weight:700}
.nm{font-weight:700;display:flex;align-items:center;gap:6px}
.rome{font-size:10px;color:var(--muted)}
.tm{color:var(--muted);font-size:11.5px}
.rec{font-family:"Roboto Mono",monospace;font-weight:700;text-align:right;white-space:nowrap}
.star{border:0;background:none;cursor:pointer;color:var(--line);padding:0 2px;font-size:14px;line-height:1}
.star.on{color:var(--gold)}
.scroll{overflow-x:auto}
.empty{text-align:center;padding:56px 16px;color:var(--muted);font-size:13.5px}
.sec-h{font-size:13px;font-weight:700;margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
footer{border-top:1px solid var(--line);margin-top:24px;padding:14px 0 40px;font-size:11.5px;color:var(--muted)}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.tot h3{margin:0 0 8px;font-size:13px}
.bar{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.bar i{height:6px;border-radius:3px;background:var(--accent);opacity:.75;display:block}
.bar span:first-child{width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar em{font-family:"Roboto Mono",monospace;font-style:normal;color:var(--muted);font-size:11px}
@media(max-width:400px){.rome{display:none}td,th{padding:8px 7px}}
</style>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const EV_RE = /(４×１００ｍＲ|４×４００ｍＲ|[０-９0-9]+ｍ[ＳＨ]*Ｈ|[０-９0-9]+ｍ|走幅跳|走高跳|三段跳|棒高跳|砲丸投|円盤投|やり投|ハンマー投|ジャベリックスロー)/;
const FIELD = /跳|投|スロー/;
DATA.races.forEach((r,i)=>{
  r.i=i;
  r.g = r.title.includes('女子')?'F':r.title.includes('男子')?'M':'X';
  r.ev = (r.title.match(EV_RE)||['その他'])[0];
  r.field = FIELD.test(r.ev);
  r.hay = (r.title+' '+r.rows.map(x=>x.name+x.roma+x.team+x.bib).join(' ')).toLowerCase();
  r.rows.forEach(x=>{x.race=r});
});
const allRows = DATA.races.flatMap(r=>r.rows);

$('#meetTitle').textContent = DATA.meet.split('\n')[0];
$('#meetSub').textContent = DATA.meet.split('\n').slice(1).join('／') + '　2026年6月20日（土）・' + DATA.venue;
const teams=new Set(), events=new Set();
DATA.races.forEach(r=>{events.add(r.ev); r.rows.forEach(x=>x.team&&teams.add(x.team))});
$('#sRaces').textContent=DATA.races.length;
$('#sEntries').textContent=allRows.length;
$('#sEvents').textContent=events.size;
$('#sTeams').textContent=teams.size;

/* favourites */
const FKEY='hok-fav-v1';
let favs=new Set(JSON.parse(localStorage.getItem(FKEY)||'[]'));
const favId = x => x.bib+'|'+x.name;
function toggleFav(id){ favs.has(id)?favs.delete(id):favs.add(id);
  localStorage.setItem(FKEY,JSON.stringify([...favs])); render(); }
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-fav]'); if(!b) return;
  e.preventDefault(); e.stopPropagation(); toggleFav(b.dataset.fav);
});

/* record parsing for ranking */
function toSec(rec){
  const m=String(rec).trim();
  if(!/^[\d:.]+$/.test(m)) return null;
  const p=m.split(':').map(Number);
  if(p.some(isNaN)) return null;
  return p.length===3? p[0]*3600+p[1]*60+p[2] : p.length===2? p[0]*60+p[1] : p[0];
}

let state={view:'races',q:'',g:'ALL',ev:'ALL',openAll:false};
function chips(el,items,key){
  el.innerHTML='';
  items.forEach(([v,l])=>{
    const b=document.createElement('button');
    b.className='chip'; b.textContent=l; b.setAttribute('aria-pressed',state[key]===v);
    b.onclick=()=>{state[key]=v; chips(el,items,key); render();};
    el.appendChild(b);
  });
}
const evList=[...events].sort((a,b)=>a.localeCompare(b,'ja'));
chips($('#genderChips'),[['ALL','男女すべて'],['M','男子'],['F','女子']],'g');
chips($('#eventChips'),[['ALL','全種目'],...evList.map(e=>[e,e])],'ev');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  state.view=t.dataset.view;
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));
  window.scrollTo({top:0,behavior:'smooth'}); render();
});
$('#q').addEventListener('input',e=>{state.q=e.target.value.trim().toLowerCase(); render();});
$('#clearBtn').onclick=()=>{$('#q').value='';state.q='';render();$('#q').focus()};
$('#toggleAll').onclick=()=>{state.openAll=!state.openAll; render();};

function rowHtml(x,opts={}){
  const q=state.q;
  const id=favId(x);
  const hit=q && (x.name+x.roma+x.team+x.bib).toLowerCase().includes(q);
  return `<tr class="${hit?'hit':''} ${favs.has(id)?'fav':''}">
    <td class="rk ${x.rank==='1'?'p1':''}">${esc(x.rank)}</td>
    <td><div class="nm"><button class="star ${favs.has(id)?'on':''}" data-fav="${esc(id)}" aria-label="お気に入り">★</button>${esc(x.name)}</div>
      <div class="rome">${esc(x.roma)}${opts.showRace?' ・ '+esc(x.race.title):''}</div></td>
    <td class="tm">${esc(x.team)}</td>
    <td class="rec">${esc(x.record)}</td></tr>`;
}
function table(rows,opts){
  return `<div class="scroll"><table><thead><tr><th>順</th><th>氏名</th><th>所属</th><th style="text-align:right">記録</th></tr></thead>
    <tbody>${rows.map(x=>rowHtml(x,opts)).join('')}</tbody></table></div>`;
}
function filteredRaces(){
  return DATA.races.filter(r=>(state.g==='ALL'||r.g===state.g)&&(state.ev==='ALL'||r.ev===state.ev)&&(!state.q||r.hay.includes(state.q)));
}
function gTag(g){return g==='M'?'男子':g==='F'?'女子':'混合'}

function viewRaces(){
  const list=filteredRaces();
  $('#count').textContent=`${list.length} レース`;
  $('#toggleAll').hidden=false;
  $('#toggleAll').textContent=state.openAll?'すべて閉じる':'すべて開く';
  const open=state.openAll||!!state.q||list.length<=6;
  $('#empty').hidden=list.length>0;
  return `<div class="grid">${list.map(r=>`<details class="card" ${open?'open':''}>
    <summary><div class="ttl"><h2>${esc(r.title)}</h2>
      <div class="rmeta"><span class="tag g">${gTag(r.g)}</span><span class="tag">${esc(r.ev)}</span>
      <span>${esc(r.time.split(' ')[1]||'')}</span>${r.wind?`<span>風 ${esc(r.wind)}</span>`:''}<span>${r.rows.length}名</span></div>
    </div><span class="caret">›</span></summary>${table(r.rows)}</details>`).join('')}</div>`;
}

function viewRank(){
  $('#toggleAll').hidden=true;
  const groups={};
  DATA.races.forEach(r=>{
    if(state.g!=='ALL'&&r.g!==state.g) return;
    if(state.ev!=='ALL'&&r.ev!==state.ev) return;
    const key=(r.title.split(/ﾀｲﾑﾚｰｽ|決勝|予選|ｵｰﾌﾟﾝ/)[0]||r.title).trim();
    (groups[key]=groups[key]||[]).push(...r.rows.filter(x=>x.record&&/[\d]/.test(x.record)));
  });
  let entries=Object.entries(groups);
  if(state.q) entries=entries.map(([k,v])=>[k,v.filter(x=>(x.name+x.roma+x.team+x.bib).toLowerCase().includes(state.q))]).filter(([,v])=>v.length);
  entries.forEach(([k,v])=>{
    const field=FIELD.test(k);
    v.sort((a,b)=>{
      const A=toSec(a.record),B=toSec(b.record);
      if(A===null) return 1; if(B===null) return -1;
      return field? B-A : A-B;
    });
  });
  entries.sort((a,b)=>a[0].localeCompare(b[0],'ja'));
  $('#count').textContent=`${entries.length} 種目のベスト記録`;
  $('#empty').hidden=entries.length>0;
  return `<div class="grid rank">${entries.map(([k,v])=>`<div class="card">
    <summary style="cursor:default"><div class="ttl"><h2>${esc(k)}</h2>
    <div class="rmeta"><span class="tag g">上位${Math.min(8,v.length)}／${v.length}名</span><span>全組合算</span></div></div></summary>
    ${table(v.slice(0,8).map((x,i)=>({...x,rank:String(i+1),race:x.race})))}</div>`).join('')}</div>`;
}

function viewFav(){
  $('#toggleAll').hidden=true;
  const rows=allRows.filter(x=>favs.has(favId(x)))
    .filter(x=>(state.g==='ALL'||x.race.g===state.g)&&(state.ev==='ALL'||x.race.ev===state.ev)
      &&(!state.q||(x.name+x.roma+x.team+x.bib).toLowerCase().includes(state.q)));
  $('#count').textContent=`${rows.length} 件のお気に入り記録`;
  $('#empty').hidden=rows.length>0;
  if(!rows.length){
    $('#empty').textContent='各記録の★をタップすると、その選手の全種目の記録をここにまとめて表示します。';
    return '';
  }
  $('#empty').textContent='該当する結果がありません';
  const byName={};
  rows.forEach(x=>{(byName[x.name+'／'+x.team]=byName[x.name+'／'+x.team]||[]).push(x)});
  return `<div class="grid">${Object.entries(byName).map(([n,v])=>`<div class="card">
    <summary style="cursor:default"><div class="ttl"><h2>${esc(n)}</h2>
    <div class="rmeta"><span class="tag g">${v.length}種目</span><span>No.${esc(v[0].bib)}</span></div></div></summary>
    ${table(v,{showRace:true})}</div>`).join('')}</div>`;
}

function render(){
  const html = state.view==='races'?viewRaces(): state.view==='rank'?viewRank():viewFav();
  $('#view').innerHTML=html;
}
render();
</script>
</body>
</html>
